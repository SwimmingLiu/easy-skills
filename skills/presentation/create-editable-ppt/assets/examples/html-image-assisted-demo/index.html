<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="presentation-mode" content="html-image-assisted"><title>AI 原生知识工作流 · HTML + AI 图片模式</title><style>*{box-sizing:border-box}html,body{margin:0;background:#F1EEE7;color:#201C18;font-family:Georgia, 'Noto Serif SC', serif;letter-spacing:0}body{min-height:100vh}.deck{height:100vh;display:grid;place-items:center;padding:24px}.slide{display:none;position:relative;overflow:hidden;width:min(calc(100vw - 48px),calc(177.78vh - 48px));aspect-ratio:16/9;background:#FCF9F2;border:1px solid #D4CABC;border-radius:0px;box-shadow:0 18px 50px #0002}.slide.active{display:grid}.visual-wrap{position:absolute;inset:0 0 0 52%;overflow:hidden;background:#F1EEE7}.visual{display:block;width:100%;height:100%;object-fit:cover}.visual-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#FCF9F2 0%,#FCF9F200 46%)}.copy{position:relative;z-index:1;align-self:center;width:56%;padding:7%;max-width:760px}.copy h1{margin:0 0 24px;font-family:Georgia, 'Noto Serif SC', serif;font-size:clamp(28px,4.2vw,72px);line-height:1.08;letter-spacing:0}.copy p{margin:12px 0;color:#70665C;font-size:clamp(16px,1.5vw,28px);line-height:1.45}.steps{display:grid;gap:12px;list-style:none;padding:0;margin:26px 0 0;counter-reset:step}.steps li{counter-increment:step;display:flex;align-items:center;gap:12px;color:#201C18;font-size:clamp(16px,1.45vw,25px);line-height:1.2}.steps li:before{content:counter(step,decimal-leading-zero);display:grid;place-items:center;flex:none;width:42px;height:32px;border:1px solid #A23B2A;border-radius:0px;color:#A23B2A;font-size:12px}.full-bleed{display:block;background:#201C18}.full-bleed .visual-wrap{inset:0}.full-bleed .visual-wrap:after{background:linear-gradient(90deg,#201C18cc 0%,#201C1855 48%,#201C1800 78%)}.full-bleed .copy{position:absolute;left:0;top:0;height:100%;display:flex;justify-content:center;flex-direction:column;color:#FCF9F2;width:63%}.full-bleed .copy p{color:#FCF9F2cc}.role-process .visual-wrap,.role-comparison .visual-wrap,.role-data .visual-wrap,.role-two-column .visual-wrap{inset:10% 6% 10% 57%;border-radius:0px;border:1px solid #D4CABC}.role-process .visual-wrap:after,.role-comparison .visual-wrap:after,.role-data .visual-wrap:after,.role-two-column .visual-wrap:after{background:#201C1818}.counter{position:absolute;z-index:2;right:18px;bottom:14px;padding:5px 8px;background:#201C18aa;color:#FCF9F2;font:12px system-ui,sans-serif}.nav{position:fixed;top:50%;width:42px;height:42px;transform:translateY(-50%);border:0;border-radius:50%;background:#201C18dd;color:#FCF9F2;font-size:24px;cursor:pointer}.nav:focus-visible{outline:2px solid #A23B2A;outline-offset:3px}#prev{left:10px}#next{right:10px}@media(max-width:760px){.deck{padding:0}.slide{width:100vw;border:0;border-radius:0}.visual-wrap{inset:45% 0 0}.copy{width:100%;padding:8%;align-self:start}.copy h1{font-size:clamp(28px,8vw,48px)}.full-bleed .copy{width:92%;padding:8%}.role-process .visual-wrap,.role-comparison .visual-wrap,.role-data .visual-wrap,.role-two-column .visual-wrap{inset:52% 6% 8%}.role-process .copy,.role-comparison .copy,.role-data .copy,.role-two-column .copy{padding-top:8%}}@media print{body{background:#FCF9F2}.deck{height:auto;display:block;padding:0}.slide{display:block;width:100vw;height:56.25vw;border:0;border-radius:0;box-shadow:none;page-break-after:always}.nav,.counter{display:none}}@media screen{.slide.full-bleed{display:none}.slide.active.full-bleed{display:block}}.full-bleed .copy h1{font-size:clamp(26px,3.8vw,64px);white-space:nowrap}</style></head><body data-mode="html-image-assisted"><main class="deck"><section class="slide mode-html-image-assisted role-cover full-bleed active" data-slide="0" data-slide-id="s01" data-mode="html-image-assisted"><div class="visual-wrap"><img class="visual" src="assets/editorial-s01-cover-visual.png" alt="AI 原生知识工作流" data-asset-role="background-or-illustration" decoding="async"></div><div class="copy"><h1>AI 原生知识工作流</h1><p>把散落信息变成持续可用的判断</p></div><span class="counter">1 / 3</span></section><section class="slide mode-html-image-assisted role-process" data-slide="1" data-slide-id="s02" data-mode="html-image-assisted"><div class="visual-wrap"><img class="visual" src="assets/editorial-s02-process-visual.png" alt="四个动作，让信息持续产生价值" data-asset-role="background-or-illustration" decoding="async"></div><div class="copy"><h1>四个动作，让信息持续产生价值</h1><ol class="steps"><li>收集现场</li><li>建立关联</li><li>形成判断</li><li>推进行动</li></ol></div><span class="counter">2 / 3</span></section><section class="slide mode-html-image-assisted role-closing full-bleed" data-slide="2" data-slide-id="s03" data-mode="html-image-assisted"><div class="visual-wrap"><img class="visual" src="assets/editorial-s03-closing-visual.png" alt="先重做一条高频流程" data-asset-role="background-or-illustration" decoding="async"></div><div class="copy"><h1>先重做一条高频流程</h1><p>把上下文、判断和行动连起来</p></div><span class="counter">3 / 3</span></section></main><button class="nav" id="prev" type="button" title="上一页" aria-label="上一页">‹</button><button class="nav" id="next" type="button" title="下一页" aria-label="下一页">›</button><script>(()=>{const slides=[...document.querySelectorAll('.slide')];let current=0;function show(next){if(!slides.length)return;slides[current]?.classList.remove('active');current=(next+slides.length)%slides.length;slides[current]?.classList.add('active')}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1)})})();</script></body></html>
