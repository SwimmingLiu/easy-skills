<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 原生知识工作流</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;letter-spacing:0}.deck{height:100vh;display:grid;place-items:center}.slide{display:none;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}.slide.active{display:block}.slide img{width:100%;height:100%;display:block;object-fit:contain}.slide span{position:absolute;right:16px;bottom:10px;background:#0009;padding:5px 8px;font-size:12px}button{position:fixed;top:50%;width:42px;height:42px;border:0;background:#000a;color:#fff;font-size:24px;cursor:pointer}#prev{left:8px}#next{right:8px}</style></head><body><main class="deck"><section class="slide active" data-slide="0"><img src="slides/business-minimal-s01-cover.png" alt="AI 原生知识工作流"><span>1 / 3</span></section><section class="slide" data-slide="1"><img src="slides/business-minimal-s02-process.png" alt="四个动作，让信息持续产生价值"><span>2 / 3</span></section><section class="slide" data-slide="2"><img src="slides/business-minimal-s03-closing.png" alt="先重做一条高频流程"><span>3 / 3</span></section></main><button id="prev" title="上一页" aria-label="上一页">‹</button><button id="next" title="下一页" aria-label="下一页">›</button><script>const slides=[...document.querySelectorAll('.slide')];let current=0;function show(next){slides[current].classList.remove('active');current=(next+slides.length)%slides.length;slides[current].classList.add('active')}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1)});</script></body></html>
