<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="presentation-mode" content="pure-html"><title>AI 原生知识工作流 · 纯 HTML 示例</title><style>*{box-sizing:border-box}html,body{margin:0;background:#F1EEE7;color:#201C18;font-family:Georgia, 'Noto Serif SC', serif;letter-spacing:0}body{min-height:100vh}.deck{height:100vh;display:grid;place-items:center;padding:24px}.slide{display:none;position:relative;overflow:hidden;width:min(calc(100vw - 48px),calc(177.78vh - 48px));aspect-ratio:16/9;background:#FCF9F2;border:1px solid #D4CABC;border-radius:0px;box-shadow:0 18px 50px #0002}.slide.active{display:grid}.art{position:absolute;inset:10% 6% 10% 57%;overflow:hidden;background:#F1EEE7;border:1px solid #D4CABC;border-radius:0px}.art:before{content:"";position:absolute;width:46%;aspect-ratio:1;border:1px solid #A23B2A;border-radius:50%;right:10%;top:17%;opacity:.72}.art:after{content:"";position:absolute;width:70%;height:1px;background:#285C7A;right:-5%;top:65%;transform:rotate(-25deg);transform-origin:right center;opacity:.82}.signal{position:absolute;display:block;background:#A23B2A;opacity:.86}.signal-a{width:18%;height:18%;left:12%;bottom:14%}.signal-b{width:30%;height:1px;left:22%;bottom:28%;transform:rotate(90deg);transform-origin:left center;background:#285C7A}.signal-c{width:10%;height:10%;right:22%;bottom:16%;border:1px solid #A23B2A;background:transparent}.copy{position:relative;z-index:1;align-self:center;width:56%;padding:7%;max-width:760px}.copy h1{margin:0 0 24px;font-family:Georgia, 'Noto Serif SC', serif;font-size:clamp(28px,4.2vw,72px);line-height:1.08;letter-spacing:0}.copy p{margin:12px 0;color:#70665C;font-size:clamp(16px,1.5vw,28px);line-height:1.45}.steps{display:grid;gap:12px;list-style:none;padding:0;margin:26px 0 0;counter-reset:step}.steps li{counter-increment:step;display:flex;align-items:center;gap:12px;color:#201C18;font-size:clamp(16px,1.45vw,25px);line-height:1.2}.steps li:before{content:counter(step,decimal-leading-zero);display:grid;place-items:center;flex:none;width:42px;height:32px;border:1px solid #A23B2A;border-radius:0px;color:#A23B2A;font-size:12px}.full-bleed{display:block;background:#201C18}.full-bleed .art{inset:0;border:0;border-radius:0;background:#201C18}.full-bleed .art:before{width:48%;right:9%;top:23%;border-color:#A23B2A;opacity:.75}.full-bleed .art:after{background:#285C7A;top:60%;opacity:.75}.full-bleed .signal-a{background:#A23B2A}.full-bleed .signal-b{background:#285C7A}.full-bleed .signal-c{border-color:#A23B2A}.full-bleed .copy{position:absolute;left:0;top:0;height:100%;display:flex;justify-content:center;flex-direction:column;color:#FCF9F2;width:63%}.full-bleed .copy p{color:#FCF9F2cc}.counter{position:absolute;z-index:2;right:18px;bottom:14px;padding:5px 8px;background:#201C18aa;color:#FCF9F2;font:12px system-ui,sans-serif}.nav{position:fixed;top:50%;width:42px;height:42px;transform:translateY(-50%);border:0;border-radius:50%;background:#201C18dd;color:#FCF9F2;font-size:24px;cursor:pointer}.nav:focus-visible{outline:2px solid #A23B2A;outline-offset:3px}#prev{left:10px}#next{right:10px}@media(max-width:760px){.deck{padding:0}.slide{width:100vw;border:0;border-radius:0}.art{inset:48% 6% 8%}.copy{width:100%;padding:8%;align-self:start}.copy h1{font-size:clamp(28px,8vw,48px)}.full-bleed .copy{width:92%;padding:8%}.full-bleed .art{inset:0}.role-process .art,.role-comparison .art,.role-data .art,.role-two-column .art{inset:52% 6% 8%}.role-process .copy,.role-comparison .copy,.role-data .copy,.role-two-column .copy{padding-top:8%}}@media print{body{background:#FCF9F2}.deck{height:auto;display:block;padding:0}.slide{display:block;width:100vw;height:56.25vw;border:0;border-radius:0;box-shadow:none;page-break-after:always}.nav,.counter{display:none}}@media screen{.slide.full-bleed{display:none}.slide.active.full-bleed{display:block}}.full-bleed .copy h1{font-size:clamp(26px,3.8vw,64px);white-space:nowrap}</style></head><body data-mode="pure-html"><main class="deck"><section class="slide mode-pure-html role-cover full-bleed active" data-slide="0" data-slide-id="s01" data-mode="pure-html"><div class="art" aria-hidden="true"><span class="signal signal-a"></span><span class="signal signal-b"></span><span class="signal signal-c"></span></div><div class="copy"><h1>AI 原生知识工作流</h1><p>把散落信息变成持续可用的判断</p></div><span class="counter">1 / 3</span></section><section class="slide mode-pure-html role-process" data-slide="1" data-slide-id="s02" data-mode="pure-html"><div class="art" aria-hidden="true"><span class="signal signal-a"></span><span class="signal signal-b"></span><span class="signal signal-c"></span></div><div class="copy"><h1>四个动作，让信息持续产生价值</h1><ol class="steps"><li>收集现场</li><li>建立关联</li><li>形成判断</li><li>推进行动</li></ol></div><span class="counter">2 / 3</span></section><section class="slide mode-pure-html role-closing full-bleed" data-slide="2" data-slide-id="s03" data-mode="pure-html"><div class="art" aria-hidden="true"><span class="signal signal-a"></span><span class="signal signal-b"></span><span class="signal signal-c"></span></div><div class="copy"><h1>先重做一条高频流程</h1><p>把上下文、判断和行动连起来</p></div><span class="counter">3 / 3</span></section></main><button class="nav" id="prev" type="button" title="上一页" aria-label="上一页">‹</button><button class="nav" id="next" type="button" title="下一页" aria-label="下一页">›</button><script>(()=>{const slides=[...document.querySelectorAll('.slide')];let current=0;function show(next){if(!slides.length)return;slides[current]?.classList.remove('active');current=(next+slides.length)%slides.length;slides[current]?.classList.add('active')}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);addEventListener('keydown',event=>{if(['ArrowRight','PageDown',' '].includes(event.key))show(current+1);if(['ArrowLeft','PageUp'].includes(event.key))show(current-1)})})();</script></body></html>
